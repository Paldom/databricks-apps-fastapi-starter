# SonarCloud automatic analysis (the CI workflow sonar.yml uses sonar-project.properties).
sonar.sources=.
sonar.exclusions=frontend/src/shared/api/generated/**,.agents/**,**/node_modules/**,backend/public/**,frontend/public/mockServiceWorker.js,backend/alembic/versions/**
sonar.tests=backend/tests
sonar.test.inclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx
sonar.cpd.exclusions=frontend/src/shared/api/generated/**,frontend/src/mocks/**
