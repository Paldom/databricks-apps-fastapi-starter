[project]
name = "databricks-apps-fastapi-starter"
version = "0.1.0"
description = "Sample FastAPI application to showcase how to leverage Databricks services."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.135.1",
    "uvicorn==0.42.0",
    "asyncpg==0.31.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",
    "python-dotenv==1.2.2",
    "databricks-sdk==0.100.0",
    "sqlalchemy==2.0.48",
    "secure==1.0.1",
    "openai>=2.36,<3",
    "databricks-openai>=0.17,<1",
    "python-multipart==0.0.22",
    "opentelemetry-distro",
    "opentelemetry-exporter-otlp-proto-grpc",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-logging",
    "opentelemetry-instrumentation-sqlalchemy",
    "opentelemetry-instrumentation-requests",
    "opentelemetry-instrumentation-httpx",
    "langgraph>=0.4,<1",
    "langchain-openai>=0.3,<1",
    "langchain-core>=0.3,<1",
    "mlflow[databricks]>=3.14,<4",
    "alembic==1.18.4",
    "langchain>=0.3,<1",
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.6",
    "mypy==1.19.1",
    "pre-commit>=4.3,<5",
    "import-linter>=2.3,<3",
    "bandit",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "locust>=2.19,<3",
    "httpx",
    "pytest-mock",
    "pyyaml",
    "types-PyYAML",
]

[tool.mypy]
ignore_missing_imports = true
exclude = ["notebooks"]

[tool.ruff]
line-length = 88
extend-exclude = ["notebooks"]


[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 65
show_missing = false

[tool.bandit]
skips = ["B101", "B105", "B608"]
exclude_dirs = [".venv", "notebooks"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "app*",
]
exclude = [
    "tests*",
    "notebooks*",
]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Layered architecture: api -> services -> repositories -> models"
type = "layers"
layers = ["app.api", "app.services", "app.repositories", "app.models"]

[[tool.importlinter.contracts]]
name = "core must not depend on chat or agents"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.chat", "app.agents"]
