bundle:
  name: databricks-apps-fastapi-starter
  databricks_cli_version: ">= 1.15.0, <= 1.99.99"
  engine: direct

include:
  - resources/*.yml

# The frontend is built on the deploying machine and shipped inside backend/public.
experimental:
  scripts:
    prebuild: npm ci --prefix frontend && npm run build --prefix frontend

sync:
  include:
    - backend/public/**
  exclude:
    - backend/public/**/*.map
    - backend/public/mockServiceWorker.js
    - backend/tests/**
    - frontend/**
    - .github/**
    - backend/.venv/**
    - backend/.mypy_cache/**
    - backend/.ruff_cache/**
    - backend/.pytest_cache/**
    - "*.egg-info/**"
    - backend/.coverage
    - "*.md"

variables:
  app_name:
    description: Databricks Apps name (30 characters max)
    default: fastapi-starter-dev
  resource_name_suffix:
    description: Suffix for workspace resource names
    default: dev
  environment:
    description: Runtime environment label (development, staging, production)
    default: development
  log_level:
    description: App log level
    default: INFO
  enable_obo:
    description: Forward the user token to the app (on-behalf-of)
    default: "false"
  enable_docs:
    description: Serve the OpenAPI docs UI
    default: "false"
  enable_examples:
    description: Mount the showcase routes under /api/examples
    default: "false"
  otel_traces_sampler:
    description: OpenTelemetry sampler for app spans
    default: always_on
  supervisor_model:
    description: Foundation Model endpoint used by the chat supervisor (bound with CAN_QUERY)
    default: databricks-claude-sonnet-4-6
  title_model:
    description: Model for chat titles (empty = supervisor model)
    default: ""
  ai_gateway_embedding_model:
    description: Embedding endpoint for the knowledge specialist and the AI Search index
    default: databricks-gte-large-en
  knowledge_assistant_endpoint_name:
    description: Knowledge Assistant serving endpoint (Agent Bricks); empty disables the specialist
    default: ""
  knowledge_assistant_name:
    description: Knowledge Assistant name that the ingestion job registers the index with; empty skips it
    default: ""
  app_agent_name:
    description: Remote Databricks App used as the app specialist; empty disables it
    default: ""
  genie_space_id:
    description: Genie space for the data specialist; empty disables it
    default: ""
  serving_agent_endpoint:
    description: Serving endpoint of the optional serving agent; empty disables it
    default: ""
  serving_agent_uc_model_name:
    description: Unity Catalog model name for the serving agent
    default: ""
  serving_agent_chat_model:
    description: Model the serving agent calls
    default: databricks-claude-sonnet-4-6
  rag_catalog_name:
    description: Catalog that owns the schema, volume, tables and telemetry
    default: main
  rag_schema_name:
    description: Schema name (prefixed per developer in development mode)
    default: starter_rag
  rag_volume_name:
    description: Managed volume for uploaded knowledge files
    default: uploads
  agent_eval_dataset_name:
    description: Optional UC-backed MLflow evaluation dataset
    default: ""
  app_experiment_name:
    description: MLflow experiment for app traces
    default: /Shared/${bundle.name}/app-${bundle.target}
  agent_eval_experiment_name:
    description: MLflow experiment for agent evaluations
    default: /Shared/${bundle.name}/evals-${bundle.target}
  serving_agent_experiment_name:
    description: MLflow experiment for the serving agent
    default: /Shared/${bundle.name}/serving-agent-${bundle.target}
  lakebase_endpoint_settings:
    type: complex
    description: Compute settings of the Lakebase production endpoint
    default:
      autoscaling_limit_min_cu: 0.5
      autoscaling_limit_max_cu: 2
      suspend_timeout_duration: 300s

targets:
  dev:
    mode: development
    default: true
    variables:
      resource_name_suffix: dev
      environment: development
      enable_docs: "true"
      enable_examples: "true"
      app_name: fastapi-starter-dev
    resources:
      jobs:
        rag_ingestion_job:
          trigger:
            # development mode pauses triggers; the file-arrival ingestion must fire in dev
            pause_status: UNPAUSED
      postgres_projects:
        app_db:
          purge_on_delete: true

  staging:
    workspace:
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      resource_name_suffix: stg
      environment: staging
      app_name: fastapi-starter-stg
      otel_traces_sampler: parentbased_traceidratio

  prod:
    workspace:
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      resource_name_suffix: prod
      environment: production
      enable_obo: "true"
      app_name: fastapi-starter-prod
      otel_traces_sampler: parentbased_traceidratio
      lakebase_endpoint_settings:
        autoscaling_limit_min_cu: 1
        autoscaling_limit_max_cu: 4
        no_suspension: true
    resources:
      apps:
        fastapi_app:
          forward_user_access_token: true
          user_api_scopes:
            - genie
            - files
      postgres_projects:
        app_db:
          lifecycle:
            prevent_destroy: true
