bundle:
  name: databricks-apps-fastapi-starter
  databricks_cli_version: ">= 0.283.0"

include:
  - resources/*.yml
  # Optional-capability modules (DESIGN.md): comment a line out to disable
  # that module's Databricks resources.
  - resources/modules/knowledge-diy.yml
  # - resources/modules/cost-guardrail.yml   # scheduled app stop/start (opt-in)
  # - resources/modules/supervisor-agent.yml  # Agent Bricks MAS binding stub (opt-in)

sync:
  # The built frontend is gitignored but must ship with the app source.
  include:
    - backend/public/**
  exclude:
    - backend/tests/**
    - frontend/**
    - .github/**
    - backend/.venv/**
    - backend/.mypy_cache/**
    - backend/.ruff_cache/**
    - backend/.pytest_cache/**
    - "*.egg-info/**"
    - backend/.coverage
    - "*.md"

variables:
  app_name:
    description: Databricks app name (Apps API limit is 30 characters)
    default: fastapi-starter
  resource_name_suffix:
    description: Environment suffix for resource names
    default: dev
  environment:
    description: Runtime environment label
    default: development
  log_level:
    description: App log level
    default: INFO
  enable_obo:
    description: Whether to enable OBO behavior
    default: "false"
  knowledge_assistant_endpoint_name:
    description: Name of the Knowledge Assistant serving endpoint (created in Agent Bricks)
    default: ""
  knowledge_assistant_name:
    description: Knowledge Assistant entity name for bootstrap source registration
    default: ""
  app_agent_name:
    description: Name of the remote Databricks App specialist agent
    default: ""
  genie_space_id:
    description: Genie space ID for data specialist
    default: ""
  supervisor_model:
    description: Model name for the LangGraph supervisor
    default: ""
  serving_agent_endpoint:
    description: Name of the serving agent endpoint
    default: ""
  serving_agent_uc_model_name:
    description: Unity Catalog model name for the serving agent
    default: ""
  serving_agent_chat_model:
    description: Upstream LLM model name the serving agent calls via AI Gateway
    default: databricks-claude-sonnet-4
  serving_agent_experiment_name:
    description: MLflow experiment path for serving agent traces
    default: /Shared/databricks-apps-fastapi-starter/serving-agent
  app_experiment_name:
    description: MLflow experiment path for app traces and evaluations
    default: /Shared/databricks-apps-fastapi-starter/app
  ai_gateway_embedding_model:
    description: Embedding model for knowledge specialist
    default: ""
  title_model:
    description: Model for chat title generation (defaults to supervisor model)
    default: ""
  langgraph_memory_backend:
    description: LangGraph memory backend (inmemory or lakebase)
    # Deployed apps always have the Lakebase binding, so chat memory is
    # durable by default; local dev uses inmemory (see backend/env.example).
    default: lakebase
  knowledge_volume_root:
    description: UC Volume root path for knowledge specialist
    default: ""
  vector_search_endpoint_name:
    description: Vector Search endpoint name for knowledge specialist
    default: ""
  vector_search_index_name:
    description: Vector Search index name for knowledge specialist
    default: ""
  chat_endpoint_name:
    description: Existing model serving endpoint the app queries for chat (FMAPI pay-per-token by default)
    default: databricks-meta-llama-3-3-70b-instruct
  rag_catalog_name:
    description: Catalog for RAG schema/tables/volume
    default: main
  rag_schema_name:
    description: Schema for RAG objects
    default: starter_rag
  rag_volume_name:
    description: Managed volume name for uploaded knowledge files
    default: uploads
  knowledge_upload_root:
    description: Volume subpath monitored by file-arrival trigger
    default: /Volumes/main/starter_rag/uploads/knowledge/uploads
  rag_checkpoint_root:
    description: Checkpoint root for raw ingestion (outside upload subtree)
    default: /Volumes/main/starter_rag/uploads/system/checkpoints/rag_ingestion
  rag_raw_table_name:
    description: Raw uploaded documents Delta table
    default: main.starter_rag.rag_raw_documents
  rag_summary_table_name:
    description: Delta table for per-document ai_query() summaries
    default: main.starter_rag.rag_document_summaries
  rag_chunk_table_name:
    description: Parsed and chunked documents Delta table
    default: main.starter_rag.rag_document_chunks
  agent_eval_experiment_name:
    description: MLflow experiment path for unified agent evaluations
    default: /Shared/databricks-apps-fastapi-starter/evals
  agent_eval_dataset_name:
    description: Optional UC-backed MLflow evaluation dataset name
    default: ""
  enable_docs:
    description: Serve interactive API docs (/docs) from the app
    default: "false"
  app_config:
    type: complex
    description: >-
      Runtime config for the Databricks app, shared by all targets; per-target
      differences come only from the scalar variables referenced below.
    default:
      command:
        - opentelemetry-instrument
        - python
        - run_app.py
      env:
        # Optional specialist env vars (GENIE_SPACE_ID, SUPERVISOR_MODEL,
        # SERVING_AGENT_ENDPOINT, KNOWLEDGE_ASSISTANT_ENDPOINT, ...) are
        # omitted: bundles prune empty values and the Apps API rejects
        # valueless entries. Add an entry with a real value to enable one.
        # PGHOST/PGDATABASE/PGUSER are injected automatically by the Apps
        # runtime from the lakebase-db resource binding — do not map them
        # manually.
        - name: SERVE_STATIC
          value: "true"
        - name: ENABLE_DOCS
          value: ${var.enable_docs}
        - name: ENVIRONMENT
          value: ${var.environment}
        - name: LOG_LEVEL
          value: ${var.log_level}
        - name: ENABLE_OBO
          value: ${var.enable_obo}
        - name: ENABLE_DATABRICKS_INTEGRATIONS
          value: "true"
        - name: ENABLE_LOCAL_DEV_AUTH_FALLBACK
          value: "false"
        - name: OTEL_TRACES_SAMPLER
          value: always_on
        # No OTLP collector runs inside the Apps runtime; point
        # OTEL_EXPORTER_OTLP_ENDPOINT at a collector to re-enable export.
        - name: OTEL_TRACES_EXPORTER
          value: none
        - name: OTEL_METRICS_EXPORTER
          value: none
        - name: OTEL_LOGS_EXPORTER
          value: none
        - name: OTEL_PYTHON_LOG_CORRELATION
          value: "true"
        - name: SERVING_ENDPOINT_NAME
          value_from: serving-endpoint
        - name: JOB_ID
          value_from: app-job
        - name: VOLUME_ROOT
          value_from: uc-volume
        - name: LANGGRAPH_MEMORY_BACKEND
          value: ${var.langgraph_memory_backend}
        - name: ENABLE_CHAT_TITLE_GENERATION
          value: "true"
        - name: MAX_UPLOAD_BYTES
          value: "52428800"
        - name: MLFLOW_TRACKING_URI
          value: "databricks"
        - name: MLFLOW_REGISTRY_URI
          value: "databricks-uc"
        - name: MLFLOW_EXPERIMENT_ID
          value_from: experiment

targets:
  dev:
    mode: development
    default: true
    variables:
      resource_name_suffix: dev
      environment: development
      log_level: DEBUG
      enable_docs: "true"
      serving_agent_endpoint: serving-agent-dev
  staging:
    workspace:
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      resource_name_suffix: stg
      environment: staging
      log_level: INFO
      app_name: fastapi-starter-stg
      serving_agent_endpoint: serving-agent-stg

  prod:
    workspace:
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      resource_name_suffix: prod
      environment: production
      log_level: INFO
      enable_obo: "true"
      app_name: fastapi-starter-prod
      serving_agent_endpoint: serving-agent-prod
