resources:
  apps:
    fastapi_app:
      name: ${var.app_name}
      description: FastAPI + React starter with Lakebase, AI Search and a LangGraph supervisor
      source_code_path: ../backend
      compute_size: MEDIUM
      lifecycle:
        started: true # deploy also starts the app
      # Preview fields, set per target when needed: budget_policy_id / usage_policy_id (serverless
      # usage policy), compute_min_instances + compute_max_instances (scale out), space (app spaces),
      # git_repository + git_source (deploy from Git instead of the bundle's source_code_path).
      config:
        command:
          - opentelemetry-instrument
          - python
          - run_app.py
        env:
          - name: APP_VERSION
            value: ${bundle.git.commit}
          - name: ENVIRONMENT
            value: ${var.environment}
          - name: LOG_LEVEL
            value: ${var.log_level}
          - name: ENABLE_OBO
            value: ${var.enable_obo}
          - name: ENABLE_DOCS
            value: ${var.enable_docs}
          - name: ENABLE_EXAMPLES
            value: ${var.enable_examples}
          - name: SERVE_STATIC
            value: "true"
          - name: ENABLE_DATABRICKS_INTEGRATIONS
            value: "true"
          - name: ENABLE_LOCAL_DEV_AUTH_FALLBACK
            value: "false"
          - name: OTEL_TRACES_SAMPLER
            value: ${var.otel_traces_sampler}
          - name: OTEL_TRACES_SAMPLER_ARG
            value: "0.1"
          - name: OTEL_PYTHON_LOG_CORRELATION
            value: "true"
          - name: OTEL_PYTHON_LOG_FORMAT
            value: "%(asctime)s %(levelname)s [%(name)s] [request_id=%(request_id)s session_id=%(session_id)s user_id=%(user_id)s trace_id=%(otelTraceID)s span_id=%(otelSpanID)s] - %(message)s"
          - name: JOB_ID
            value_from: app-job
          - name: VOLUME_ROOT
            value_from: uc-volume
          - name: SUPERVISOR_MODEL
            value_from: supervisor-model
          - name: MLFLOW_EXPERIMENT_ID
            value_from: experiment
          - name: MLFLOW_TRACKING_URI
            value: databricks
          - name: MLFLOW_REGISTRY_URI
            value: databricks-uc
          # The platform points OTLP at the telemetry tables; MLflow would otherwise export
          # traces only there and never to the experiment.
          - name: MLFLOW_TRACE_ENABLE_OTLP_DUAL_EXPORT
            value: "true"
          - name: AI_GATEWAY_EMBEDDING_MODEL
            value_from: embedding-model
          - name: VECTOR_SEARCH_ENDPOINT_NAME
            value: ${resources.vector_search_endpoints.rag_endpoint.name}
          - name: VECTOR_SEARCH_INDEX_NAME
            value: ${var.rag_catalog_name}.${resources.schemas.rag_schema.name}.rag_chunks_index
          - name: ENABLE_CHAT_TITLE_GENERATION
            value: "true"
          # Optional specialists (the platform rejects empty values): uncomment together with
          # the matching binding below and set the variable in your target.
          # - name: TITLE_MODEL
          #   value: ${var.title_model}
          # - name: KNOWLEDGE_ASSISTANT_ENDPOINT
          #   value_from: knowledge-assistant
          # - name: APP_AGENT_NAME
          #   value_from: app-agent
          # - name: GENIE_SPACE_ID
          #   value_from: genie-space
          # - name: SERVING_AGENT_ENDPOINT
          #   value_from: serving-agent
          # A bound secret arrives as its value; the key must exist in the bundle scope before
          # the deploy (databricks secrets put-secret <scope> <key>).
          # - name: EXAMPLE_SECRET
          #   value_from: app-secret
          - name: MAX_UPLOAD_BYTES
            value: "52428800"
      telemetry_export_destinations:
        - unity_catalog:
            logs_table: ${var.rag_catalog_name}.${resources.schemas.rag_schema.name}.app_logs
            metrics_table: ${var.rag_catalog_name}.${resources.schemas.rag_schema.name}.app_metrics
            traces_table: ${var.rag_catalog_name}.${resources.schemas.rag_schema.name}.app_traces
      # permissions are set per target (dev: all users). A service principal that evaluates the app
      # through the ingress needs CAN_USE too:
      # permissions:
      #   - level: CAN_USE
      #     service_principal_name: <evaluation service principal>
      resources:
        - name: postgres
          description: Lakebase database (schemas are created by the app's migrations)
          postgres:
            branch: ${resources.postgres_projects.app_db.id}/branches/production
            database: ${resources.postgres_databases.main_database.id}
            permission: CAN_CONNECT_AND_CREATE
        - name: experiment
          experiment:
            experiment_id: ${resources.experiments.app_experiment.id}
            permission: CAN_MANAGE
        - name: app-job
          job:
            id: ${resources.jobs.rag_ingestion_job.id}
            permission: CAN_MANAGE_RUN
        - name: uc-volume
          uc_securable:
            securable_type: VOLUME
            securable_full_name: ${var.rag_catalog_name}.${resources.schemas.rag_schema.name}.${resources.volumes.rag_upload_volume.name}
            permission: WRITE_VOLUME
        # MLflow trace tables (created together with the experiment through its trace_location,
        # a preview field): the app writes spans, logs, metrics and annotations. If a workspace
        # ignores trace_location, delete these four bindings and grant MODIFY on the schema in
        # scripts/postdeploy_grants.sh instead. The schema-level SELECT for index queries stays in
        # the hook because the index only exists after the first ingestion run.
        - name: trace-spans
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.rag_catalog_name}.${resources.schemas.rag_schema.name}.${resources.experiments.app_experiment.trace_location.uc_trace_location.table_prefix}_otel_spans
            permission: MODIFY
        - name: trace-logs
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.rag_catalog_name}.${resources.schemas.rag_schema.name}.${resources.experiments.app_experiment.trace_location.uc_trace_location.table_prefix}_otel_logs
            permission: MODIFY
        - name: trace-metrics
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.rag_catalog_name}.${resources.schemas.rag_schema.name}.${resources.experiments.app_experiment.trace_location.uc_trace_location.table_prefix}_otel_metrics
            permission: MODIFY
        - name: trace-annotations
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.rag_catalog_name}.${resources.schemas.rag_schema.name}.${resources.experiments.app_experiment.trace_location.uc_trace_location.table_prefix}_otel_annotations
            permission: MODIFY
        - name: supervisor-model
          serving_endpoint:
            name: ${var.supervisor_model}
            permission: CAN_QUERY
        - name: embedding-model
          serving_endpoint:
            name: ${var.ai_gateway_embedding_model}
            permission: CAN_QUERY
        # Optional specialist bindings (pair with the env entries above):
        # - name: genie-space
        #   genie_space: { name: "${var.genie_space_id}", space_id: "${var.genie_space_id}", permission: CAN_RUN }
        # - name: knowledge-assistant
        #   serving_endpoint: { name: "${var.knowledge_assistant_endpoint_name}", permission: CAN_QUERY }
        # - name: serving-agent
        #   serving_endpoint: { name: "${var.serving_agent_endpoint}", permission: CAN_QUERY }
        # - name: app-agent
        #   app: { name: "${var.app_agent_name}", permission: CAN_USE }
        # - name: app-secret
        #   secret: { scope: "${resources.secret_scopes.app_secrets.name}", key: example, permission: READ }
        #   (declare READ for the app's service principal on the scope too, see app_secrets.secret_scope.yml)
        # - name: sql-warehouse
        #   sql_warehouse: { id: "${var.sql_warehouse_id}", permission: CAN_USE }
