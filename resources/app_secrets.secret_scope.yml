# Workspace secret scope owned by the bundle. Bundles create scopes, never values: put the keys
# with `databricks secrets put-secret <scope> <key>` after the first deploy. The evaluation job reads
# client-id/client-secret here; an app binds a key with `secret: {scope, key, permission: READ}` and
# receives the value through `value_from` (see the optional block in fastapi_app.app.yml).
resources:
  secret_scopes:
    app_secrets:
      name: ${bundle.name}-${var.resource_name_suffix}
      backend_type: DATABRICKS
      lifecycle:
        prevent_destroy: false
