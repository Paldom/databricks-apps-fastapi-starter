# Workspace secret scope for keys the app binds (`secret: {scope, key, permission: READ}` +
# `value_from`). Bundles create scopes, never values: put keys with `databricks secrets put-secret`.
# Secret ACLs are scope-wide and the bundle reconciles them on every deploy, so a target that
# enables a binding also declares READ for the app's service principal (its client id is known
# after the first deploy: `databricks apps get <app>`), for example:
#   permissions:
#     - level: READ
#       service_principal_name: <app service principal client id>
resources:
  secret_scopes:
    app_secrets:
      name: ${bundle.name}-app-${var.resource_name_suffix}
