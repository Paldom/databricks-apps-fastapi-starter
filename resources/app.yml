resources:
  apps:
    fastapi_app:
      name: ${var.app_name}
      description: "FastAPI RAG starter deployed from bundle"
      source_code_path: ../backend
      config: ${var.app_config}
      user_api_scopes:
        - files.files
      permissions:
        - level: CAN_USE
          group_name: users
      resources:
        - name: serving-endpoint
          serving_endpoint:
            name: ${var.chat_endpoint_name}
            permission: CAN_QUERY
        - name: app-job
          job:
            id: ${resources.jobs.rag_ingestion_job.id}
            permission: CAN_MANAGE_RUN
        - name: uc-volume
          uc_securable:
            securable_type: VOLUME
            securable_full_name: ${var.rag_catalog_name}.${resources.schemas.rag_schema.name}.${resources.volumes.rag_upload_volume.name}
            permission: WRITE_VOLUME
        - name: lakebase-db
          database:
            # Bind via the instance, not the UC catalog registration — the
            # catalog needs metastore CREATE CATALOG, which some workspaces gate.
            database_name: starter_app
            instance_name: ${resources.database_instances.lakebase_oltp.name}
            permission: CAN_CONNECT_AND_CREATE
        # --- Optional bindings (uncomment + set real IDs to enable) --------
        # Bindings cannot reference empty values, so optional resources ship
        # commented out. See cheat-sheet/apps-env-and-bindings.md.
        #
        # - name: sql-warehouse           # powers /examples/sql
        #   sql_warehouse:
        #     id: <warehouse-id>
        #     permission: CAN_USE
        # - name: genie-space             # first-class Genie binding
        #   genie_space:
        #     space_id: <genie-space-id>
        #     permission: CAN_RUN
        # - name: app-secret              # secret scope/key injection
        #   secret:
        #     scope: <scope>
        #     key: <key>
        #     permission: READ
        # -------------------------------------------------------------------
        - name: experiment
          experiment:
            experiment_id: ${resources.experiments.app_experiment.id}
            permission: CAN_MANAGE
