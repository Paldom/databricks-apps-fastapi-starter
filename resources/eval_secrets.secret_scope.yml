# Workspace secret scope for the evaluation job: keys `client-id` and `client-secret` of a service
# principal with CAN_USE on the app. Separate from the app scope because scope ACLs are scope-wide.
# Add READ for the identity that runs agent_eval_job when it is not the deployer:
#   permissions:
#     - level: READ
#       service_principal_name: <evaluation run_as>
resources:
  secret_scopes:
    eval_secrets:
      name: ${bundle.name}-eval-${var.resource_name_suffix}
