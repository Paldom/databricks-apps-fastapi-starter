resources:
  postgres_projects:
    app_db:
      project_id: fastapi-starter-${var.resource_name_suffix}
      display_name: fastapi-starter ${var.resource_name_suffix}
      pg_version: 17
      default_endpoint_settings: ${var.lakebase_endpoint_settings}
      custom_tags:
        - key: bundle
          value: ${bundle.name}
        - key: target
          value: ${bundle.target}

  postgres_roles:
    app_role:
      parent: ${resources.postgres_projects.app_db.id}/branches/production
      role_id: app
      postgres_role: app

  postgres_databases:
    main_database:
      parent: ${resources.postgres_projects.app_db.id}/branches/production
      database_id: app
      postgres_database: app
      role: ${resources.postgres_roles.app_role.id}
