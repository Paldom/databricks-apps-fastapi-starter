resources:
  database_instances:
    lakebase_oltp:
      name: starter-oltp-${var.resource_name_suffix}
      capacity: CU_1

  # Optional: register the Lakebase database as a Unity Catalog catalog so SQL
  # warehouses can query it. Requires metastore-level CREATE CATALOG, which many
  # workspaces gate — the app itself binds via the instance (resources/app.yml)
  # and `make grant-db-access` creates the `starter_app` database, so this stays
  # off by default. Uncomment if your workspace allows it.
  # database_catalogs:
  #   app_database:
  #     database_instance_name: ${resources.database_instances.lakebase_oltp.name}
  #     name: starter_app_${var.resource_name_suffix}
  #     database_name: starter_app
  #     create_database_if_not_exists: true
