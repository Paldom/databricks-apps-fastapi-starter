resources:
  jobs:
    rag_ingestion_job:
      name: RagIngestionJob-${var.resource_name_suffix}
      max_concurrent_runs: 1
      trigger:
        file_arrival:
          url: /Volumes/${var.rag_catalog_name}/${resources.schemas.rag_schema.name}/${resources.volumes.rag_upload_volume.name}/knowledge/uploads/
          min_time_between_triggers_seconds: 60
          wait_after_last_change_seconds: 61
      environments:
        - environment_key: serverless
          spec:
            client: "3"
            dependencies:
              - databricks-vectorsearch>=0.66
              - databricks-sdk>=0.100  # knowledge_assistants service for the KA registration
      tasks:
        - task_key: ingest_documents
          environment_key: serverless
          notebook_task:
            notebook_path: ../notebooks/jobs/rag_ingestion_job.py
            base_parameters:
              source_path: /Volumes/${var.rag_catalog_name}/${resources.schemas.rag_schema.name}/${resources.volumes.rag_upload_volume.name}/knowledge/uploads/
              checkpoint_path: /Volumes/${var.rag_catalog_name}/${resources.schemas.rag_schema.name}/${resources.volumes.rag_upload_volume.name}/system/checkpoints/rag_ingestion
              raw_table_name: ${var.rag_catalog_name}.${resources.schemas.rag_schema.name}.rag_raw_documents
              chunk_table_name: ${var.rag_catalog_name}.${resources.schemas.rag_schema.name}.rag_document_chunks
              vector_search_endpoint_name: ${resources.vector_search_endpoints.rag_endpoint.name}
              vector_search_index_name: ${var.rag_catalog_name}.${resources.schemas.rag_schema.name}.rag_chunks_index
              embedding_model_name: ${var.ai_gateway_embedding_model}
              knowledge_assistant_name: ${var.knowledge_assistant_name}
