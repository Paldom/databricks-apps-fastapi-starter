resources:
  experiments:
    agent_eval_experiment:
      name: ${var.agent_eval_experiment_name}
      trace_location:
        uc_trace_location:
          catalog: ${var.rag_catalog_name}
          schema: ${resources.schemas.rag_schema.name}
          table_prefix: evals_mlflow

  jobs:
    agent_eval_job:
      name: AgentEval-${var.resource_name_suffix}
      max_concurrent_runs: 1
      queue:
        enabled: true
      environments:
        - environment_key: serverless
          spec:
            client: "3"
            dependencies:
              - mlflow[databricks]>=3.14,<4
              - databricks-openai>=0.17,<1
              - databricks-sdk>=0.100
              - databricks-agents>=1.0 # mlflow.genai.datasets on Databricks
      tasks:
        # One evaluation per target; the list is a bundle variable (JSON) so targets are
        # added per environment without editing the job.
        - task_key: eval_each_target
          for_each_task:
            inputs: ${var.eval_targets}
            concurrency: 1
            task:
              task_key: eval_target
              environment_key: serverless
              notebook_task:
                notebook_path: ../notebooks/evals/run_agent_evals.py
                base_parameters:
                  target_kind: "{{input.kind}}"
                  target_name: "{{input.name}}"
                  eval_experiment_id: ${resources.experiments.agent_eval_experiment.id}
                  dataset_name: ${var.agent_eval_dataset_name}
                  judge_model: ${var.judge_model}
                  eval_secret_scope: ${var.eval_secret_scope}
                  sql_warehouse_id: ${var.sql_warehouse_id}
