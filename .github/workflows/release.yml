name: Release

# Cut a release by pushing an annotated tag: git tag -a vX.Y.Z && git push origin vX.Y.Z
# This app deploys to Databricks Apps and is NOT published to PyPI
# (pyproject carries the "Private :: Do Not Upload" classifier). A release is a
# gated GitHub Release carrying the verified wheel/sdist with build provenance.

on:
  push:
    tags: ["v*.*.*"]

permissions: {} # deny-all default; each job requests only what it needs

jobs:
  test:
    # A tag push does not inherit the tagged commit's CI status — re-run the
    # full quality gate before releasing.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          # No caching in the release pipeline: a poisoned shared cache could
          # influence published artifacts.
          enable-cache: false
          python-version: '3.11'
      - name: Install backend (locked)
        run: cd backend && uv sync --locked
      - name: Quality gate
        run: |
          cd backend
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy .
          uv run pytest --cov

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          # No caching in the release pipeline: a poisoned shared cache could
          # influence published artifacts.
          enable-cache: false
          python-version: '3.11'
      - name: Check tag matches project version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd backend
          VERSION="$(uv version --short)"
          if [[ "v$VERSION" != "$TAG" ]]; then
            echo "::error::Tag $TAG does not match project version $VERSION"
            exit 1
          fi
      - name: Build artifacts
        run: cd backend && uv build
      - name: Validate artifacts
        run: uvx --from twine==6.2.0 twine check --strict backend/dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: backend/dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    environment: release # gated — requires human approval before publishing
    permissions:
      contents: write # create the GitHub Release (no PyPI publishing here)
      id-token: write # sign build provenance attestations
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$REPO" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
