name: Load test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --frozen --directory backend --extra dev
      - name: Start app
        run: cd backend && uv run uvicorn app.main:app & sleep 5
      - name: Run Locust
        run: |
          cd backend && \
          HOST=http://localhost:8000 \
          DATABRICKS_HOST="$DATABRICKS_HOST" \
          DATABRICKS_CLIENT_ID="$DATABRICKS_CLIENT_ID" \
          DATABRICKS_CLIENT_SECRET="$DATABRICKS_CLIENT_SECRET" \
          uv run locust -f tests/performance/locustfile.py --headless -u 50 -r 10 -t 60s --csv=locust --csv-full-history --html=locust-report.html
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: locust-results
          path: |
            backend/locust_stats_history.csv
            backend/locust-report.html
