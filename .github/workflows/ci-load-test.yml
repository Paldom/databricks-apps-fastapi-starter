name: Load test

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  load-test:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST != '' && secrets.DATABRICKS_HOST || 'localhost' }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID != '' && secrets.DATABRICKS_CLIENT_ID || 'dummy' }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET != '' && secrets.DATABRICKS_CLIENT_SECRET || 'dummy' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: cd backend && uv sync --locked
      - name: Start app
        run: cd backend && uv run uvicorn app.main:app & sleep 5
      - name: Run Locust
        run: |
          cd backend && \
          HOST=http://localhost:8000 \
          DATABRICKS_HOST="$DATABRICKS_HOST" \
          DATABRICKS_CLIENT_ID="$DATABRICKS_CLIENT_ID" \
          DATABRICKS_CLIENT_SECRET="$DATABRICKS_CLIENT_SECRET" \
          uv run locust -f tests/performance/locustfile.py --headless -u 50 -r 10 -t 60s --csv=locust --csv-full-history --html=locust-report.html
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: locust-results
          path: |
            backend/locust_stats_history.csv
            backend/locust-report.html
