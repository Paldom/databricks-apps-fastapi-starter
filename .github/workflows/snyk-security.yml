name: Snyk Security

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Weekly Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snyk:
    # Needs the SNYK_TOKEN secret; enable with the repository variable SNYK_ENABLED=true.
    if: vars.SNYK_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen --directory backend

      - name: Install Snyk CLI
        run: npm install -g snyk

      # Failing gate — exits non-zero on high/critical vulnerabilities
      - name: Snyk open-source test
        run: snyk test --file=backend/requirements.txt --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk code test (SAST)
        run: snyk code test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk IaC test
        run: snyk iac test databricks.yml resources/*.yml
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk monitor (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: snyk monitor --file=backend/requirements.txt
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
