name: Snyk Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"    # Weekly Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  snyk:
    runs-on: ubuntu-latest
    # Requires a Snyk account; forks/clones without the secret skip instead of failing.
    if: ${{ secrets.SNYK_TOKEN != '' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: cd backend && uv sync --locked

      - name: Install Snyk CLI
        # Pinned global CLI tool; no project lockfile applies here.
        run: npm install -g snyk@1.1305.2 # zizmor: ignore[adhoc-packages]

      # Failing gate — exits non-zero on high/critical vulnerabilities
      - name: Snyk open-source test
        run: snyk test --file=backend/requirements.txt --severity-threshold=high --sarif-file-output=snyk-oss.sarif
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk code test (SAST)
        run: snyk code test --sarif-file-output=snyk-code.sarif || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk IaC test
        run: snyk iac test databricks.yml resources/*.yml --sarif-file-output=snyk-iac.sarif || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Upload OSS SARIF
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        continue-on-error: true
        with:
          sarif_file: snyk-oss.sarif
          category: snyk-oss

      - name: Upload Code SARIF
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        continue-on-error: true
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

      - name: Upload IaC SARIF
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        continue-on-error: true
        with:
          sarif_file: snyk-iac.sarif
          category: snyk-iac

      - name: Snyk monitor (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: snyk monitor --file=backend/requirements.txt
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
