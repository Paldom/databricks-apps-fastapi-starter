name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: '3.11'
      - name: Install backend (locked)
        run: cd backend && uv sync --locked
      - name: Ruff check
        run: cd backend && uv run ruff check .
      - name: Ruff format check
        run: cd backend && uv run ruff format --check .
      - name: Bandit
        run: cd backend && uv run bandit -r app -c pyproject.toml -q

  backend-typecheck:
    name: Backend typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: '3.11'
      - name: Install backend (locked)
        run: cd backend && uv sync --locked
      - name: Mypy
        run: cd backend && uv run mypy .

  backend-test:
    name: Backend test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # requires-python is ">=3.11,<3.12"; extend when the range widens.
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: '3.11'
      - name: Install backend (locked)
        run: cd backend && uv sync --locked
      - name: Pytest with coverage gate
        env:
          HYPOTHESIS_PROFILE: ci
        run: cd backend && uv run pytest --cov

  frontend:
    name: Frontend build (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Keep in sync with "engines" in frontend/package.json
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: cd frontend && npm ci
      - name: Build frontend
        run: cd frontend && npm run build

  contracts:
    name: Contract & Frontend checks (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: '3.11'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend (locked)
        run: cd backend && uv sync --locked
      - name: Install frontend
        run: cd frontend && npm ci
      - name: Export backend OpenAPI
        run: cd backend && uv run python scripts/export_openapi.py
      - name: Regenerate frontend API client
        run: cd frontend && npm run api:gen
      - name: Check generated files are committed
        run: |
          git diff --exit-code -- backend/requirements.txt backend/openapi.yaml frontend/src/shared/api/generated || {
            echo "::error::Generated files are out of sync. Run: make generate"
            exit 1
          }
      - name: Frontend typecheck
        run: cd frontend && npm run typecheck
      - name: Frontend lint
        run: cd frontend && npm run lint
      - name: Frontend test
        run: cd frontend && npm run test
      - name: Check requirements.txt is in sync
        run: |
          cd backend
          uv export --no-dev --no-emit-project --no-hashes --no-editable --format=requirements.txt > /tmp/requirements-check.txt
          diff -u requirements.txt /tmp/requirements-check.txt || {
            echo "::error::requirements.txt is out of sync. Run: make requirements-export"
            exit 1
          }

  bundle-validate:
    name: Bundle Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: databricks/setup-cli@60b64e3937ee15f5a8b914664d1e78a586a9a4da # v1.11.0
      - name: Validate bundle (dev)
        run: databricks bundle validate -t dev

  all-checks-passed:
    name: all-checks-passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - backend-lint
      - backend-typecheck
      - backend-test
      - frontend
      - contracts
      - bundle-validate
    # Without this the job is skipped when a dependency fails — and a skipped
    # required check counts as success.
    if: always()
    steps:
      - name: Fail if any needed job did not succeed
        env:
          ANY_FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          if [[ "$ANY_FAILED" == "true" ]]; then
            echo "::error::A required job failed, was cancelled, or was skipped."
            exit 1
          fi
          echo "All checks passed."
