name: Deploy

# Ships with service-principal client-secret auth for portability. The
# hardened alternative is GitHub OIDC federation (no long-lived secrets):
# see docs/oidc-deploy.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Bundle target"
        required: true
        default: prod
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  contents: read
  id-token: write

env:
  BUNDLE_TARGET: ${{ inputs.target || 'prod' }}
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
  DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1

      - name: Set up Python
        run: uv python install 3.11

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Databricks CLI
        uses: databricks/setup-cli@71b5fa6b2b94c9a543658f65ebb6b477913f8626 # v1.6.0

      - name: Install backend deps
        run: cd backend && uv sync --locked

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Export backend OpenAPI
        run: cd backend && uv run python scripts/export_openapi.py

      - name: Regenerate frontend API client
        run: cd frontend && npm run api:gen

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Validate bundle
        run: databricks bundle validate -t "$BUNDLE_TARGET"

      - name: Deploy bundle
        run: databricks bundle deploy -t "$BUNDLE_TARGET"

      - name: Deploy serving agent
        run: databricks bundle run -t "$BUNDLE_TARGET" deploy_serving_agent
        continue-on-error: true

      - name: Bootstrap RAG resources
        if: ${{ vars.VECTOR_SEARCH_INDEX_NAME != '' }}
        run: databricks bundle run -t "$BUNDLE_TARGET" rag_bootstrap_job
        continue-on-error: true

      - name: Bootstrap Knowledge Assistant index source (fallback)
        if: ${{ vars.KNOWLEDGE_ASSISTANT_NAME != '' }}
        run: cd backend && uv run python scripts/upsert_knowledge_assistant_source.py
        env:
          KNOWLEDGE_ASSISTANT_NAME: ${{ vars.KNOWLEDGE_ASSISTANT_NAME }}
          VECTOR_SEARCH_INDEX_NAME: ${{ vars.VECTOR_SEARCH_INDEX_NAME }}
        continue-on-error: true

      - name: Run app
        run: databricks bundle run -t "$BUNDLE_TARGET" fastapi_app
