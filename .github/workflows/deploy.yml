name: Deploy

# Push to main deploys the dev target after the CI gate passes on the same commit.
# staging and prod are deployed only by hand (workflow_dispatch) and run inside a GitHub
# environment of the same name, which is where required reviewers are configured.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Bundle target
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  contents: read

jobs:
  checks:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit # pragma: allowlist secret
    permissions:
      contents: read
      id-token: write

  deploy:
    name: Deploy ${{ inputs.target || 'dev' }}
    permissions:
      contents: read
      id-token: write # GitHub OIDC token for the Databricks CLI and SDK
    needs: checks
    runs-on: ubuntu-latest
    environment: ${{ inputs.target || 'dev' }}
    concurrency:
      group: deploy-${{ inputs.target || 'dev' }}
      cancel-in-progress: false
    env:
      TARGET: ${{ inputs.target || 'dev' }}
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_AUTH_TYPE: github-oidc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install 3.11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: databricks/setup-cli@fd1d91d9d3b5f1191a2aae9206f7c68a997dc52d # v1.16.0
        with:
          version: 1.16.0

      - name: Validate
        run: databricks bundle validate -t "$TARGET"

      - name: Deploy (builds the frontend via the bundle prebuild script, provisions, starts the app)
        run: databricks bundle deploy -t "$TARGET"

      - name: Wait until the app serves this commit
        run: |
          APP_NAME=$(databricks bundle summary -t "$TARGET" -o json | jq -r '.resources.apps.fastapi_app.name')
          APP_URL=$(databricks apps get "$APP_NAME" -o json | jq -r '.url')
          # Unified auth (github-oidc) through the SDK; the CLI's `auth token` only serves cached user logins.
          TOKEN=$(uv run --frozen --no-build --no-install-project --directory backend python -c 'from databricks.sdk import WorkspaceClient; print(WorkspaceClient().config.oauth_token().access_token)')
          echo "::add-mask::$TOKEN"
          for attempt in $(seq 1 36); do
            VERSION=""
            if BODY=$(curl -sS --max-time 15 -H "Authorization: Bearer $TOKEN" "$APP_URL/api/health"); then
              VERSION=$(echo "$BODY" | jq -r '.version // empty' 2>/dev/null) || VERSION=""
            fi
            if [ "$VERSION" = "$GITHUB_SHA" ]; then
              echo "App $APP_NAME serves commit $VERSION"
              exit 0
            fi
            sleep 10
          done
          echo "::error::App $APP_NAME did not report version $GITHUB_SHA within 6 minutes"
          exit 1
